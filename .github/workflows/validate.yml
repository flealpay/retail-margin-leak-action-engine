name: Reproduce and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install plotting dependency
        run: python -m pip install -r requirements.txt
      - name: Python behavioral tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Reproduce the complete synthetic project
        run: python run.py
      - name: Validate dashboard model
        run: node test_dashboard.js
      - name: Check dashboard syntax
        run: node --check dashboard/app.js
      - name: Validate packaged assets and SQL queries
        run: python scripts/verify_package.py

